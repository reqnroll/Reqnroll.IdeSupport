# Plugin identity
pluginGroup = net.reqnroll.idesupport.rider
# Marketplace plugin ID -- deliberately does NOT contain "rider": JetBrains' Plugin Verifier
# rejects IDs containing the target IDE's name ("The plugin ID ... should not include the word
# 'rider'"), caught by ./gradlew verifyPlugin. Kept separate from pluginGroup (Gradle coordinate,
# unrestricted) and the net.reqnroll.idesupport.rider Kotlin package name (also unrestricted).
pluginId = net.reqnroll.idesupport
pluginName = reqnroll-ide-support-rider
# pluginVersion is intentionally not set here: CI passes -PpluginVersion; local builds derive it from
# build/Version.props (see build.gradle.kts).

# Compatibility range of the frontend-only plugin (the default build) — bump alongside platformVersion when
# targeting a new Rider release. A -PwithBackend=true build ignores this and derives its range from
# riderSdkVersion instead (see build.gradle.kts).
pluginSinceBuild = 243
pluginUntilBuild = 262.*

# The Rider release the backend module is compiled against when building with -PwithBackend=true. One setting
# drives the SDK package version, the supported since/until range, the plugin version suffix and the releases
# verifyPlugin checks. Keep the default in src/Rider/dotnet/Directory.Build.props the same, so an IDE build of
# the module uses the same SDK.
riderSdkVersion = 2026.2.3.1

# IntelliJ Platform Gradle Plugin coordinates (see build.gradle.kts).
# "RD" selects the Rider platform artifact; platformVersion pins the exact Rider build
# the plugin compiles/runs against during development (`./gradlew runIde`).
platformType = RD
platformVersion = 2024.3.5

kotlin.stdlib.default.dependency = false
org.gradle.jvmargs = -Xmx2g
