---
name: Documentation request
description: Suggest an improvement to the docs (README, CONTRIBUTING, or docs/)
labels: [documentation]
body:
- type: input
  attributes:
    label: Related Documentation Page
    placeholder: e.g. docs/LSP-IDE-Support-Overview.md, src/LSP/CONTRIBUTING.md
- type: dropdown
  attributes:
    label: Type of the problem
    options:
      - Incorrect information
      - Missing information
      - Stale / out of date with as-built behavior
      - Typo, language or grammar error
      - Broken link or display
  validations:
    required: true
- type: textarea
  attributes:
    label: Problem Description
  validations:
    required: true
